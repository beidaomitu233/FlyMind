# New isolated deployment only. Supply all infrastructure credentials explicitly.
server:
  address: ${ADMIN_BIND_ADDRESS:127.0.0.1}
  port: ${ADMIN_PORT:18080}
spring:
  application:
    name: flymind-admin
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${ADMIN_DB_JDBC_URL}
          username: ${ADMIN_DB_USER}
          password: ${ADMIN_DB_PASSWORD}
  data:
    redis:
      host: ${ADMIN_REDIS_HOST}
      port: ${ADMIN_REDIS_PORT:6379}
      password: ${ADMIN_REDIS_PASSWORD}
      database: ${ADMIN_REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
tenant:
  enable: true
  excludes:
    - sys_tenant
    - sys_tenant_package
    - sys_menu
# JWT_SECRET is mandatory (>=32 bytes). No default account/password is supplied.
