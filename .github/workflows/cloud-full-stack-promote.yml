name: Promote verified full-stack candidate
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main cloud-candidate run ID
        type: string
        required: true
      run_attempt:
        description: Verified latest run attempt (retained successful jobs are accepted)
        type: string
        required: true
      source_sha:
        description: Exact 40-character candidate source commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cloud-production
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Pure provenance and full-stack command-order guards (no network)
        run: node --test tests/cloud-full-stack-promote.test.mjs tests/cloud-full-stack-deploy.test.mjs
      - name: Verify immutable candidate provenance before any server contact
        env:
          CI_TOKEN: ${{ github.token }}
          CLOUD_CONTROL_PLANE_DEPLOY: ${{ vars.CLOUD_CONTROL_PLANE_DEPLOY }}
          EXPECTED_SOURCE_RUN_ID: ${{ inputs.run_id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/cloud-full-stack-provenance.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: flymind-linux-x64
          path: download
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Promote same verified JAR then application and admin
        env:
          DEPLOY_ENVIRONMENT: production
          DEPLOY_CONTROL_PLANE_DEPLOY: 'true'
          DEPLOY_TRANSPORT: ${{ vars.CLOUD_ARTIFACT_HTTPS == 'true' && 'artifact-https' || 'bytes' }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: node scripts/upload-cloud-candidate.mjs
