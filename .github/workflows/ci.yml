name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # The public package currently supports Windows only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup:runtime
      - run: npm run build
      - run: npm test
