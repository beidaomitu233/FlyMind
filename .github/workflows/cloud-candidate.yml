name: Build cloud candidate
on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy this main run after source and all platform checks (explicit full-stack mode required)
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    # Delivery records do not change the running application or drawing rules.
    paths-ignore: ['AGENTS.md', 'docs/releases/**', 'docs/validation/**']
  pull_request:
    paths: ['server/**', 'src/**', 'scripts/**', 'integrations/**', 'deploy/**', 'package*.json', '.github/workflows/cloud-candidate.yml']
permissions:
  contents: read
concurrency:
  group: cloud-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-20
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17.0.19
          cache: maven
          cache-dependency-path: integrations/xinghui-admin/backend/**/pom.xml
      - run: npm ci
      - run: npm run setup:runtime
      - run: npm run build
      - name: Local account browser and compiled Runtime
        run: node --import tsx scripts/local-auth-ui-probe.mjs
      - name: Two browsers, MCP and update recovery
        run: node --import tsx scripts/cloud-ui-probe.mjs
      - name: Cloud and local contract gates
        run: node --import tsx --test --test-concurrency=1 tests/cloud-wire.test.ts tests/cloud-client.test.ts tests/flymind-documentation.test.ts tests/cloud-workspaces.test.ts tests/cloud-http.test.ts tests/cloud-collaboration.test.ts tests/cloud-merge.test.ts tests/cloud-mcp.test.ts tests/cloud-oauth.test.ts tests/cloud-mcp-updates.test.ts tests/cloud-maintenance.test.ts tests/local-auth.test.ts tests/local-auth-runtime.test.ts tests/native-session.test.ts tests/native-text-drafts.test.ts tests/task-groups.test.ts tests/drawio-outer-return.test.ts tests/native-undo-guard.test.ts tests/native-import-batch.test.ts tests/native-activity.test.ts tests/native-exports.test.ts tests/cloud-deployment.test.mjs tests/cloud-full-stack-deploy.test.mjs tests/cloud-artifact-source.test.mjs tests/cloud-python-extract.test.mjs
      - name: Packaged control-plane smoke contract fixtures (no infrastructure)
        run: node --test tests/control-plane-runtime-smoke.test.mjs tests/cloud-control-plane.test.mjs tests/cloud-full-stack-promote.test.mjs
      - name: Restricted artifact transfer validation (local fake source only)
        run: |
          python tests/cloud-artifact-fetch.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Artifact receiver validation failed' }
          python tests/cloud-ssh-command.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Forced command validation failed' }
          python tests/cloud-control-plane-install.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Console installer validation failed' }
          python tests/cloud-node-ownership-repair.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Fixed Node ownership validation failed' }
      - name: Java control plane
        shell: pwsh
        run: |
          $env:JWT_SECRET=[Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(48))
          try {
            mvn -f integrations/xinghui-admin/backend/pom.xml -s integrations/xinghui-admin/backend/build-settings.xml '-Dtest=Flymind*Test' '-Dsurefire.failIfNoSpecifiedTests=false' "-Dflymind.nodeExecutable=$((Get-Command node).Source)" package
            if ($LASTEXITCODE -ne 0) { throw 'Java verification failed' }
          } finally { Remove-Item Env:JWT_SECRET -ErrorAction SilentlyContinue }
      - name: Build controlled admin UI
        working-directory: integrations/xinghui-admin/frontend
        run: |
          npm exec --yes --package=pnpm@10.28.1 -- pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Admin dependencies failed' }
          npm exec --yes --package=pnpm@10.28.1 -- node scripts/build-flymind-admin.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Admin build failed' }
      - name: Assemble source candidate
        run: node scripts/build-cloud-bundle.mjs --output=output/cloud-source --release-id=run-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-source
          path: output/cloud-source/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  control_plane_runtime:
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: flymind_ci
          MYSQL_USER: flymind_ci
          MYSQL_PASSWORD: ci-isolated-service-only
          MYSQL_ROOT_PASSWORD: ci-isolated-root-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17.0.19
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cloud-source
          path: cloud-source
      - name: Linux fixed Node ownership repair fixtures (no host changes)
        run: python3 tests/cloud-node-ownership-repair.test.py
      - name: Actual packaged JAR, MySQL 8, Redis 7 and independent account lifecycle
        env:
          FLYMIND_CI_CONTROL_PLANE_SMOKE: '1'
          MYSQL_DATABASE: flymind_ci
          MYSQL_USER: flymind_ci
          MYSQL_PASSWORD: ci-isolated-service-only
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          SMOKE_REPORT_PATH: control-plane-runtime-evidence.json
        run: node scripts/control-plane-runtime-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-plane-runtime-evidence
          path: control-plane-runtime-evidence.json
          if-no-files-found: error
          retention-days: 30
  platform:
    needs: [source, control_plane_runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep Chromium sandbox enabled; 22.04 avoids hosted AppArmor userns limits and has an older glibc baseline.
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cloud-source
          path: candidate
      - name: Install platform dependencies
        working-directory: candidate/application
        run: npm ci --omit=dev
      - name: Linux browser libraries
        if: runner.os == 'Linux'
        run: node candidate/application/node_modules/playwright-core/cli.js install-deps chromium
      - name: Fixed engine and browser supply
        working-directory: candidate/application
        run: npm run setup:runtime
      - name: Five-kind real PNG and SQLite verification
        working-directory: candidate/application
        run: npm run smoke
      - name: Freeze exact platform archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf flymind-${{ matrix.platform }}.tar.gz -C candidate .
          sha256sum flymind-${{ matrix.platform }}.tar.gz > flymind-${{ matrix.platform }}.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flymind-${{ matrix.platform }}
          path: |
            flymind-${{ matrix.platform }}.tar.gz
            flymind-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
  staging:
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUD_AUTO_STAGING == 'true' && vars.CLOUD_AUTO_PRODUCTION != 'true'
    needs: platform
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: cloud-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: flymind-linux-x64
          path: download
      - name: Deploy verified staging candidate
        env:
          DEPLOY_ENVIRONMENT: staging
          DEPLOY_CONTROL_PLANE_DEPLOY: ${{ vars.CLOUD_CONTROL_PLANE_DEPLOY || 'false' }}
          DEPLOY_SOURCE_RUN_ID: ${{ github.run_id }}
          DEPLOY_SOURCE_SHA: ${{ github.sha }}
          DEPLOY_TRANSPORT: ${{ vars.CLOUD_ARTIFACT_HTTPS == 'true' && 'artifact-https' || 'bytes' }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: node scripts/upload-cloud-candidate.mjs
  production:
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && vars.CLOUD_AUTO_PRODUCTION == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true))
    needs: [source, control_plane_runtime, platform]
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: cloud-production
      cancel-in-progress: false
    steps:
      - name: Require one deployment mode
        env:
          AUTO_STAGING: ${{ vars.CLOUD_AUTO_STAGING }}
          CONTROL_PLANE_DEPLOY: ${{ vars.CLOUD_CONTROL_PLANE_DEPLOY }}
        run: |
          test "$AUTO_STAGING" != 'true'
          if [ "$CONTROL_PLANE_DEPLOY" != 'true' ]; then
            echo 'Production requires explicit CLOUD_CONTROL_PLANE_DEPLOY=true; app-only deployment cannot establish Java compatibility.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: flymind-linux-x64
          path: download
      - name: Deploy exact verified production candidate
        env:
          DEPLOY_ENVIRONMENT: production
          DEPLOY_CONTROL_PLANE_DEPLOY: ${{ vars.CLOUD_CONTROL_PLANE_DEPLOY || 'false' }}
          DEPLOY_SOURCE_RUN_ID: ${{ github.run_id }}
          DEPLOY_SOURCE_SHA: ${{ github.sha }}
          DEPLOY_TRANSPORT: ${{ vars.CLOUD_ARTIFACT_HTTPS == 'true' && 'artifact-https' || 'bytes' }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: node scripts/upload-cloud-candidate.mjs
