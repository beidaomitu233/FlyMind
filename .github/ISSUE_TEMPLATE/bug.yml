name: 缺陷报告
description: MCP、画布交互或制品异常
body:
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: FlyMind 版本、系统、Node、MCP 客户端或浏览器
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与实际/预期结果
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 去敏的最小图形或错误
      description: 不上传客户信息、凭据、data/ 或浏览器备份。
