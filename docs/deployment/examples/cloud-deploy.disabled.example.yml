          # Dispatcher must finish/record room ACK boundary, backup/fence old
          # SQLite writer, switch, real health, then reopen writes or hold maintenance.
          # Auto rollback must NEVER overwrite post-release user data.
          echo '::error::No approved production dispatcher or restore drill exists.'
